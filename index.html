  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--paper-dark);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
  }
  .app{
    display:flex;
    min-height:100vh;
  }

  /* ============ SIDEBAR — BINDER TABS ============ */
  .sidebar{
    width:260px;
    flex-shrink:0;
    background:var(--paper-dark);
    padding:28px 0 28px 18px;
    border-right:1px solid var(--rule);
    display:flex;
    flex-direction:column;
  }
  .maiolica-strip{
    height:16px;
    margin:-28px -0px 16px -18px;
    width:calc(100% + 18px);
    background-image:var(--maiolica-url);
    background-repeat:repeat-x;
    background-size:auto 16px;
    background-position:left center;
    opacity:0.9;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    padding:16px 18px 20px 14px;
  }
  .brand img{ width:38px; height:38px; flex-shrink:0; }
  .brand .txt{ display:flex; flex-direction:column; line-height:1.15; }
  .brand .name{ font-family:'Arcon', sans-serif; font-weight:400; font-size:18px; color:var(--ink); }
  .brand .role{ font-family:'Regencie', sans-serif; font-weight:300; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:var(--gold); margin-top:2px;}

  .tab-list{ display:flex; flex-direction:column; gap:6px; }
  .tab{
    position:relative;
    background:var(--paper);
    border:1px solid var(--rule);
    border-right:none;
    border-radius:8px 0 0 8px;
    padding:12px 16px 12px 14px;
    cursor:pointer;
    font-size:13.5px;
    color:var(--ink-soft);
    transition:transform .15s ease, background .15s ease;
    margin-right:-1px;
  }
  .tab .num{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-soft); opacity:.6; display:block; margin-bottom:3px; letter-spacing:.05em;}
  .tab .names{ font-family:'Arcon',sans-serif; font-weight:600; font-size:15px; color:var(--ink); display:block;}
  .tab .date{ font-size:11px; color:var(--ink-soft); margin-top:2px; display:block;}
  .tab:hover{ transform:translateX(-2px); }
  .tab.active{
    background:var(--white-ish);
    border-color:var(--ink);
    transform:translateX(-6px);
    box-shadow:-2px 2px 0 rgba(42,36,32,0.08);
  }
  .tab-new{
    margin-top:10px;
    background:transparent;
    border:1px dashed var(--paper-darker);
    border-right:none;
    border-radius:8px 0 0 8px;
    padding:11px 16px 11px 14px;
    font-size:12.5px;
    color:var(--ink-soft);
    cursor:pointer;
    margin-right:-1px;
  }
  .sidebar-foot{
    margin-top:auto;
    padding:16px 18px 0 6px;
    font-size:11px;
    color:var(--ink-soft);
    line-height:1.5;
  }

  /* ============ MAIN AREA ============ */
  .main{
    flex:1;
    background:var(--white-ish);
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 36px;
    border-bottom:1px solid var(--rule);
  }
  .wedding-head .eyebrow{
    font-family:'Regencie', sans-serif; font-weight:300;
    font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold); margin-bottom:4px;
  }
  .wedding-head h1{
    font-family:'Arcon',sans-serif;
    font-weight:700;
    font-size:28px;
    color:var(--ink);
  }
  .wedding-head .meta{
    font-size:12.5px; color:var(--ink-soft); margin-top:5px;
  }
  .wedding-head .meta b{ color:var(--ink); font-weight:600; }

  .role-toggle{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:12px;
  }
  .role-toggle select{
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    padding:7px 10px;
    border:1px solid var(--ink);
    border-radius:6px;
    background:var(--paper);
    color:var(--ink);
    cursor:pointer;
  }
  .role-label{ font-family:'Regencie', sans-serif; font-weight:300; color:var(--ink-soft); font-size:12px; letter-spacing:.14em; text-transform:uppercase;}

  .subnav{
    display:flex;
    gap:2px;
    padding:0 36px;
    border-bottom:1px solid var(--rule);
  }
  .subnav button{
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:500;
    background:none;
    border:none;
    padding:14px 16px 12px 16px;
    color:var(--ink-soft);
    cursor:pointer;
    border-bottom:2px solid transparent;
    position:relative;
  }
  .subnav button.active{
    color:var(--ink);
    border-bottom:2px solid var(--wine);
  }

  .content{
    padding:28px 36px 60px 36px;
    overflow-y:auto;
  }

  /* summary cards */
  .cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    margin-bottom:28px;
  }
  .card{
    background:var(--paper);
    border:1px solid var(--rule);
    border-radius:10px;
    padding:16px 18px;
  }
  .card .label{ font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px;}
  .card .value{ font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600; color:var(--ink);}
  .card.warn .value{ color:var(--wine); }
  .card.ok .value{ color:var(--sage); }

  /* ledger table */
  .cat-block{ margin-bottom:8px; }
  .cat-title{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding:12px 0 8px 0;
    border-bottom:1px solid var(--ink);
    margin-bottom:2px;
  }
  .cat-title h3{
    font-family:'Arcon',sans-serif;
    font-weight:600;
    font-size:16px;
    color:var(--ink);
  }
  .cat-title .cat-sums{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--ink-soft);
  }
  table{ width:100%; border-collapse:collapse; margin-bottom:22px;}
  th{
    text-align:left;
    font-size:10.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
    font-weight:600;
    padding:6px 10px;
    border-bottom:1px dashed var(--rule);
  }
  td{
    padding:8px 10px;
    font-size:13px;
    border-bottom:1px dashed var(--rule);
    color:var(--ink);
  }
  td.num, th.num{ font-family:'IBM Plex Mono',monospace; text-align:right; }
  tr:last-child td{ border-bottom:1px solid var(--rule); }

  /* stamp badges */
  .stamp{
    display:inline-block;
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;
    font-weight:600;
    letter-spacing:.06em;
    padding:3px 9px;
    border-radius:20px;
    border:1.5px dashed currentColor;
    transform:rotate(-3deg);
    text-transform:uppercase;
  }
  .stamp.saldato{ color:var(--sage); }
  .stamp.acconto{ color:var(--ochre); }
  .stamp.omaggio{ color:var(--ink-soft); transform:rotate(2deg); }
  .stamp.aperto{ color:var(--wine); }

  .check{ font-family:'IBM Plex Mono',monospace; }
  .check.yes{ color:var(--sage); font-weight:700;}
  .check.no{ color:var(--rule); }

  .task-row{
    display:flex;
    gap:16px;
    padding:14px 0;
    border-bottom:1px dashed var(--rule);
  }
  .task-time{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    font-weight:600;
    color:var(--wine);
    width:60px;
    flex-shrink:0;
  }
  .task-text{ font-size:13.5px; color:var(--ink); line-height:1.5;}

  .empty-state{
    padding:40px 20px;
    text-align:center;
    color:var(--ink-soft);
    font-size:13.5px;
    border:1px dashed var(--rule);
    border-radius:10px;
  }

  .supplier-select-wrap{
    padding:14px 0 4px 0;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .supplier-select-wrap label{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft);}
  .supplier-select-wrap select{
    font-family:'Inter',sans-serif;
    font-size:13px;
    padding:8px 10px;
    border:1px solid var(--ink);
    border-radius:6px;
    background:var(--paper);
  }

  .fornitore-card{
    background:var(--paper);
    border:1px solid var(--rule);
    border-radius:10px;
    padding:22px 24px;
    margin-top:16px;
  }
  .fornitore-card h2{
    font-family:'Arcon',sans-serif;
    font-size:20px;
    margin-bottom:4px;
  }
  .fornitore-card .cat{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); margin-bottom:16px;}
  .fornitore-meta{ display:flex; gap:28px; margin-bottom:18px; flex-wrap:wrap;}
  .fornitore-meta div .k{ font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft);}
  .fornitore-meta div .v{ font-size:13.5px; margin-top:2px;}

  /* ============ MOODBOARD ============ */
  .mood-subnav{
    display:flex;
    gap:8px;
    margin-bottom:20px;
  }
  .mood-subnav button{
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    font-weight:500;
    background:var(--paper);
    border:1px solid var(--rule);
    border-radius:20px;
    padding:7px 15px;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .mood-subnav button.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--white-ish);
  }

  /* palette */
  .swatch-grid{ display:flex; flex-wrap:wrap; gap:14px; margin-bottom:22px;}
  .swatch{
    width:120px;
    border:1px solid var(--rule);
    border-radius:10px;
    overflow:hidden;
    background:var(--paper);
  }
  .swatch .chip{ height:70px; }
  .swatch .info{ padding:8px 10px; }
  .swatch .info .name{ font-size:12px; font-weight:600;}
  .swatch .info .hex{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-soft); margin-top:2px;}
  .swatch .remove{
    display:block; width:100%; text-align:center; font-size:10.5px; color:var(--wine);
    background:none; border:none; border-top:1px dashed var(--rule); padding:5px 0; cursor:pointer;
  }
  .add-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px;}
  .add-row input[type=text]{
    font-family:'Inter',sans-serif; font-size:12.5px; padding:8px 10px;
    border:1px solid var(--rule); border-radius:6px; background:var(--white-ish);
  }
  .add-row input[type=color]{ width:42px; height:36px; border:1px solid var(--rule); border-radius:6px; padding:2px; background:var(--white-ish); cursor:pointer;}
  .add-row button, .btn-mini{
    font-family:'Inter',sans-serif; font-size:12.5px; font-weight:500;
    padding:8px 14px; border-radius:6px; border:1px solid var(--ink);
    background:var(--ink); color:var(--white-ish); cursor:pointer;
  }

  /* stationery */
  .station-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; margin-top:8px;}
  .station-card{
    border:1px solid var(--rule); border-radius:10px; background:var(--paper); overflow:hidden;
  }
  .station-card .thumb{
    height:120px; display:flex; align-items:center; justify-content:center;
    background:var(--white-ish); color:var(--ink-soft); font-size:11px; text-align:center; padding:8px;
    border-bottom:1px dashed var(--rule);
  }
  .station-card .thumb img{ width:100%; height:100%; object-fit:cover; }
  .station-card .cap{ padding:8px 10px; font-size:12px; font-weight:600;}
  .station-card label.upload-mini{
    display:block; text-align:center; font-size:10.5px; color:var(--wine); padding:6px 0;
    border-top:1px dashed var(--rule); cursor:pointer;
  }
  .station-card label.upload-mini input{ display:none; }

  /* floor plan */
  .floorplan-wrap{
    position:relative;
    width:100%;
    height:520px;
    background:
      linear-gradient(180deg, #F1F6FA 0%, #F1F6FA 22%, #E3EEF6 22%, #E3EEF6 78%, #D4E4EF 78%, #D4E4EF 100%);
    border:1px solid var(--rule);
    border-radius:12px;
    overflow:hidden;
    margin-top:6px;
  }
  .zone-label{
    position:absolute; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--ink-soft); font-weight:600;
  }
  .table-dot{
    position:absolute;
    width:30px; height:30px;
    border-radius:50%;
    background:var(--white-ish);
    border:1.5px solid var(--ink-soft);
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-soft);
  }
  .staff-table{
    position:absolute;
    padding:4px 10px;
    border:1.5px dashed var(--ink-soft);
    border-radius:6px;
    font-size:9.5px; color:var(--ink-soft);
    background:rgba(245,240,226,0.6);
  }
  .station-pin{
    position:absolute;
    transform:translate(-50%,-50%);
    display:flex; align-items:center; gap:6px;
    background:var(--wine);
    color:var(--white-ish);
    border-radius:20px;
    padding:5px 10px 5px 6px;
    font-size:11px;
    font-weight:600;
    cursor:grab;
    box-shadow:0 2px 6px rgba(42,36,32,0.25);
    user-select:none;
    white-space:nowrap;
  }
  .station-pin:active{ cursor:grabbing; }
  .station-pin .n{
    background:var(--white-ish); color:var(--wine); border-radius:50%;
    width:18px; height:18px; display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:700;
    flex-shrink:0;
  }
  .floorplan-legend{
    display:flex; flex-wrap:wrap; gap:8px 18px; margin-top:14px; font-size:11.5px; color:var(--ink-soft);
  }
  .floorplan-legend span b{ color:var(--ink); }
  .floorplan-hint{ font-size:11px; color:var(--ink-soft); margin-top:8px; font-style:italic;}

  /* ============ LISTA INVITATI ============ */
  .menutag{
    display:inline-block;
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;
    font-weight:600;
    letter-spacing:.04em;
    padding:3px 8px;
    border-radius:5px;
    text-transform:uppercase;
    color:var(--white-ish);
  }
  .menutag.carne{ background:var(--wine); }
  .menutag.pesce{ background:var(--teal); }
  .menutag.vegetariano{ background:var(--sage); }
  .menutag.vegano{ background:var(--plum); }
  .menutag.bambino{ background:var(--ochre); }
  .menutag.staff{ background:var(--ink-soft); }

  .need-tag{
    display:inline-block;
    font-size:10px;
    padding:2px 8px;
    border-radius:20px;
    border:1px solid var(--rule);
    color:var(--ink-soft);
    margin-right:4px;
    white-space:nowrap;
  }

  .table-group{
    border:1px solid var(--rule);
    border-radius:10px;
    margin-bottom:16px;
    overflow:hidden;
    background:var(--paper);
  }
  .table-group-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding:12px 16px;
    background:var(--paper-dark);
    border-bottom:1px solid var(--rule);
  }
  .table-group-head h4{ font-family:'Arcon',sans-serif; font-size:15px; font-weight:600; }
  .table-group-head .tipo{ font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); }
  .seat-num{
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    color:var(--wine);
    width:22px; height:22px;
    border:1px solid var(--wine);
    border-radius:50%;
    display:inline-flex; align-items:center; justify-content:center;
    font-size:11px;
  }
  .criterio-note{
    font-size:12px; color:var(--ink-soft); font-style:italic;
    background:var(--paper); border:1px dashed var(--rule); border-radius:8px;
    padding:10px 14px; margin-bottom:18px; line-height:1.5;
  }
  .guest-form{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:10px;
    background:var(--paper);
    border:1px solid var(--rule);
    border-radius:10px;
    padding:16px;
    margin-bottom:22px;
  }
  .guest-form label{ font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); display:block; margin-bottom:4px;}
  .guest-form input[type=text], .guest-form select{
    width:100%; font-family:'Inter',sans-serif; font-size:12.5px; padding:7px 8px;
    border:1px solid var(--rule); border-radius:6px; background:var(--white-ish);
  }
  .guest-form .checks{ display:flex; gap:10px; align-items:center; font-size:11.5px; color:var(--ink-soft); flex-wrap:wrap;}
  .guest-form .checks label{ display:flex; align-items:center; gap:4px; font-size:11px; text-transform:none; letter-spacing:0; margin:0;}
  .guest-form .submit-cell{ display:flex; align-items:flex-end; }
  .search-wrap{ margin-bottom:16px; }
  .search-wrap input{
    width:100%; max-width:320px; font-family:'Inter',sans-serif; font-size:13px; padding:9px 12px;
    border:1px solid var(--ink); border-radius:8px; background:var(--white-ish);
  }
  .accoglienza-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 4px; border-bottom:1px dashed var(--rule); font-size:13.5px;
  }
  .accoglienza-row .who b{ font-weight:600; }
  .accoglienza-row .where{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--wine); }

  @media (max-width:860px){
    .app{ flex-direction:column; }
    .sidebar{ width:100%; padding:18px; border-right:none; border-bottom:1px solid var(--rule);}
    .tab, .tab-new{ border-radius:8px; border-right:1px solid var(--rule); margin-right:0;}
    .cards{ grid-template-columns:repeat(2,1fr); }
    .topbar{ flex-direction:column; align-items:flex-start; gap:12px; padding:18px;}
    .content{ padding:20px; }
  }
</style>
</head>

let state = { weddingIndex:0, role:'planner', subtab:'budget', supplierRef:null, moodSubtab:'palette', guestSubtab:'principale', guestFilter:'', schedeSupplier:null };

function fmtEuro(n){
  if(n===null || n===undefined) return '—';
  return n.toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €';
}

function currentWedding(){ return weddings[state.weddingIndex]; }

function renderSidebar(){
  const list = document.getElementById('tabList');
  list.innerHTML = weddings.map((w,i)=>`
    <div class="tab ${i===state.weddingIndex?'active':''}" onclick="selectWedding(${i})">
      <span class="num">0${i+1}</span>
      <span class="names">${w.names}</span>
      <span class="date">${w.date} · ${w.location}</span>
    </div>
  `).join('');
}

function selectWedding(i){
  state.weddingIndex = i;
  state.subtab='budget';
  state.supplierRef=null;
  state.moodSubtab='palette';
  state.guestSubtab='principale';
  state.guestFilter='';
  state.schedeSupplier=null;
  renderAll();
}

function onRoleChange(){
  state.role = document.getElementById('roleSelect').value;
  if(state.role==='fornitore') state.subtab='fornitore';
  else if(state.role==='sposi') { state.subtab='ospiti'; state.guestSubtab='principale'; }
  else state.subtab='budget';
  state.supplierRef = null;
  renderAll();
}

function renderHeader(){
  const w = currentWedding();
  const head = document.getElementById('weddingHead');
  head.innerHTML = `
    <div class="eyebrow">Matrimonio</div>
    <h1>${w.names}</h1>
    <div class="meta"><b>${w.date}</b> · ${w.location} · Chiesa: ${w.chiesa}</div>
  `;
}

function renderSubnav(){
  const nav = document.getElementById('subnav');
  if(state.role==='planner'){
    const tabs = [['budget','Budget'],['fornitori','Fornitori'],['schede','Timeline & Schede Fornitori'],['pagamenti','Pagamenti'],['ospiti','Lista Invitati'],['moodboard','Grafica & Moodboard']];
    nav.innerHTML = tabs.map(([id,label])=>`
      <button class="${state.subtab===id?'active':''}" onclick="setSubtab('${id}')">${label}</button>
    `).join('');
  } else if(state.role==='sposi'){
    nav.innerHTML = `<button class="active">Lista Invitati</button>`;
  } else {
    nav.innerHTML = `<button class="active">La mia scheda</button>`;
  }
}

function setSubtab(id){ state.subtab = id; renderContent(); renderSubnav(); }

function renderContent(){
  const c = document.getElementById('content');
  const w = currentWedding();

  if(state.role==='fornitore'){
    c.innerHTML = renderFornitoreView(w);
    persistWedding(w);
    return;
  }

  if(state.role==='planner' && FIREBASE_READY && !currentUser){
    c.innerHTML = renderLoginScreen();
    return;
  }

  if(state.subtab==='budget'){
    const totSpeso = w.categorie.reduce((a,cat)=>a+cat.speso,0);
    const rimanente = w.budgetTotale - totSpeso;
    const voceRow = (v)=>{
      const conIva = Math.round(v.stimato*1.22*100)/100;
      const delta = Math.round((conIva-(v.speso||0))*100)/100;
      return `
        <tr>
          <td>${v.v}</td>
          <td class="num">${v.q!==undefined ? v.q : '—'}</td>
          <td class="num">${v.prezzo!==undefined ? fmtEuro(v.prezzo) : '—'}</td>
          <td class="num">22%</td>
          <td class="num">${fmtEuro(v.stimato)}</td>
          <td class="num">${fmtEuro(conIva)}</td>
          <td class="num">${fmtEuro(v.speso)}</td>
          <td class="num ${delta<0?'':''}" style="color:${delta<0?'var(--wine)':'var(--ink)'}">${fmtEuro(delta)}</td>
          <td>${v.stato ? `<span class="stamp ${v.stato}">${v.stato}</span>` : ''}</td>
        </tr>
      `;
    };
    const voceHead = `<tr><th>Voce</th><th class="num">Q.tà</th><th class="num">Prezzo unit.</th><th class="num">IVA</th><th class="num">Stimato netto</th><th class="num">Totale con IVA</th><th class="num">Speso effettivo</th><th class="num">Delta</th><th>Stato</th></tr>`;
    c.innerHTML = `
      <div class="cards">
        <div class="card"><div class="label">Budget totale</div><div class="value">${fmtEuro(w.budgetTotale)}</div></div>
        <div class="card"><div class="label">Stimato</div><div class="value">${fmtEuro(w.budgetStimato)}</div></div>
        <div class="card ok"><div class="label">Speso finora</div><div class="value">${fmtEuro(totSpeso)}</div></div>
        <div class="card ${rimanente<3000?'warn':''}"><div class="label">Residuo disponibile</div><div class="value">${fmtEuro(rimanente)}</div></div>
      </div>
      <div class="criterio-note">IVA calcolata al 22% su ogni voce. "Totale con IVA" = stimato netto × 1,22. "Delta" = totale con IVA − speso effettivo (in bordeaux se lo speso ha già superato il totale con IVA previsto).</div>
      ${w.categorie.map(cat=>`
        <div class="cat-block">
          <div class="cat-title">
            <h3>${cat.nome}</h3>
            <span class="cat-sums">${fmtEuro(cat.speso)} / ${fmtEuro(cat.stimato)}</span>
          </div>
          ${cat.sottogruppi ? cat.sottogruppi.map(sg=>`
            <div style="margin:6px 0 14px 0;">
              <div style="font-family:'Arcon',sans-serif; font-weight:600; font-size:13.5px; color:var(--ink-soft); margin-bottom:4px; padding-left:2px;">${sg.nome}</div>
              <div style="overflow-x:auto;">
              <table style="min-width:920px;">
                <thead>${voceHead}</thead>
                <tbody>${sg.voci.map(voceRow).join('')}</tbody>
              </table>
              </div>
            </div>
          `).join('') : `
          <div style="overflow-x:auto;">
          <table style="min-width:920px;">
            <thead>${voceHead}</thead>
            <tbody>${cat.voci.map(voceRow).join('')}</tbody>
          </table>
          </div>
          `}
        </div>
      `).join('')}
    `;
  }

  if(state.subtab==='schede'){
    c.innerHTML = renderSchedeFornitori(w);
    persistWedding(w);
    return;
  }

  if(state.subtab==='fornitori'){
    if(!w.fornitori.length){ c.innerHTML = `<div class="empty-state">Nessun fornitore ancora registrato per questo matrimonio.</div>`; return; }
    const groups = {};
    w.fornitori.forEach(f=>{ (groups[f.cat] ||= []).push(f); });
    c.innerHTML = Object.entries(groups).map(([cat,list])=>`
      <div class="cat-block">
        <div class="cat-title"><h3>${cat}</h3></div>
        <table>
          <thead><tr><th>Fornitore</th><th>Referente</th><th>Contattato</th><th>Prenotato</th><th>Note</th></tr></thead>
          <tbody>
            ${list.map(f=>`
              <tr>
                <td>${f.nome}</td>
                <td>${f.ref}</td>
                <td class="check ${f.contattato?'yes':'no'}">${f.contattato?'✓':'—'}</td>
                <td class="check ${f.prenotato?'yes':'no'}">${f.prenotato?'✓':'—'}</td>
                <td>${f.note||''}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `).join('');
  }

  if(state.subtab==='ospiti'){
    c.innerHTML = renderGuestList(w);
    persistWedding(w);
    return;
  }

  if(state.subtab==='moodboard'){
    c.innerHTML = renderMoodboard(w);
    if(!state.moodSubtab || state.moodSubtab==='planimetria') attachDrag(w);
    persistWedding(w);
    return;
  }

  if(state.subtab==='pagamenti'){
    const flatVoci = (cat)=> cat.sottogruppi
      ? cat.sottogruppi.flatMap(sg=>sg.voci.map(v=>({...v, v:`${sg.nome} — ${v.v}`})))
      : cat.voci;
    const withMoney = w.categorie.flatMap(cat=>flatVoci(cat).filter(v=>v.stimato>0).map(v=>({...v,cat:cat.nome})));
    c.innerHTML = `
      <div class="cat-block">
        <div class="cat-title"><h3>Stato pagamenti per voce</h3></div>
        <table>
          <thead><tr><th>Categoria</th><th>Voce</th><th class="num">Costo</th><th class="num">Versato</th><th class="num">Saldo</th><th>Stato</th></tr></thead>
          <tbody>
            ${withMoney.map(v=>`
              <tr>
                <td>${v.cat}</td>
                <td>${v.v}</td>
                <td class="num">${fmtEuro(v.stimato)}</td>
                <td class="num">${fmtEuro(v.speso)}</td>
                <td class="num">${fmtEuro(v.stimato-(v.speso||0))}</td>
                <td>${v.stato ? `<span class="stamp ${v.stato}">${v.stato}</span>` : `<span class="stamp aperto">aperto</span>`}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  }
  persistWedding(w);
}

function renderFornitoreView(w){
  const supplierNames = [...new Set(w.fornitori.map(f=>f.ref))];
  if(!state.supplierRef && supplierNames.length) state.supplierRef = supplierNames[0];

  const selectHtml = `
    <div class="supplier-select-wrap">
      <label>Accedi come</label>
      <select onchange="setSupplier(this.value)">
        ${supplierNames.map(n=>`<option value="${n}" ${n===state.supplierRef?'selected':''}>${n}</option>`).join('')}
      </select>
    </div>
  `;

  if(!supplierNames.length){
    return selectHtml + `<div class="empty-state">Nessun fornitore da mostrare per questo matrimonio.</div>`;
  }

  const f = w.fornitori.find(x=>x.ref===state.supplierRef);
  const tasks = w.tasks[state.supplierRef] || [];

  return selectHtml + `
    <div class="fornitore-card">
      <h2>${f.ref}</h2>
      <div class="cat">${f.cat} · ${f.nome}</div>
      <div class="fornitore-meta">
        <div><div class="k">Matrimonio</div><div class="v">${w.names} — ${w.date}</div></div>
        <div><div class="k">Location</div><div class="v">${w.location}</div></div>
        <div><div class="k">Stato</div><div class="v">${f.prenotato?'Confermato':(f.contattato?'Contattato, in attesa di conferma':'Da contattare')}</div></div>
      </div>
      <div class="cat-title"><h3 style="font-size:14px">Timeline / cosa fare</h3></div>
      ${tasks.length ? tasks.map(t=>`
        <div class="task-row">
          <div class="task-time">${t.t}</div>
          <div class="task-text">${t.d}</div>
        </div>
      `).join('') : `<div class="empty-state" style="margin-top:10px">Nessuna timeline caricata ancora per questo fornitore — il wedding planner non ha inserito task specifici.</div>`}
    </div>
  `;
}

function setSupplier(name){ state.supplierRef = name; renderContent(); }

function renderSchedeFornitori(w){
  if(!w.fornitori.length) return `<div class="empty-state">Nessun fornitore ancora registrato per questo matrimonio.</div>`;
  if(!state.schedeSupplier) state.schedeSupplier = w.fornitori[0].ref;
  const f = w.fornitori.find(x=>x.ref===state.schedeSupplier);
  if(!f.schedaTecnica) f.schedaTecnica = [];
  if(!w.tasks) w.tasks = {};
  if(!w.tasks[f.ref]) w.tasks[f.ref] = [];
  const tasks = w.tasks[f.ref];

  const selectHtml = `
    <div class="supplier-select-wrap">
      <label>Fornitore</label>
      <select onchange="setSchedeSupplier(this.value)">
        ${w.fornitori.map(x=>`<option value="${x.ref}" ${x.ref===state.schedeSupplier?'selected':''}>${x.ref} — ${x.cat}</option>`).join('')}
      </select>
    </div>
  `;

  const schedaHtml = `
    <div class="fornitore-card">
      <h2>${f.ref}</h2>
      <div class="cat">${f.cat} · ${f.nome}</div>
      <div class="fornitore-meta">
        <div><div class="k">Contattato</div><div class="v">
          <label style="font-size:12px; display:flex; align-items:center; gap:6px;">
            <input type="checkbox" ${f.contattato?'checked':''} onchange="toggleFornitoreFlag('${f.ref}','contattato',this.checked)"> sì
          </label>
        </div></div>
        <div><div class="k">Prenotato</div><div class="v">
          <label style="font-size:12px; display:flex; align-items:center; gap:6px;">
            <input type="checkbox" ${f.prenotato?'checked':''} onchange="toggleFornitoreFlag('${f.ref}','prenotato',this.checked)"> sì
          </label>
        </div></div>
        <div style="flex:1; min-width:220px;"><div class="k">Note</div>
          <input type="text" value="${f.note||''}" onchange="updateFornitoreField('${f.ref}','note',this.value)" style="width:100%; font-size:12.5px; padding:6px 8px; border:1px solid var(--rule); border-radius:6px; background:var(--white-ish);">
        </div>
      </div>

      <div class="cat-title" style="margin-top:6px;"><h3 style="font-size:14px">Scheda tecnica</h3></div>
      ${f.schedaTecnica.length ? `
        <table>
          <thead><tr><th style="width:220px">Campo</th><th>Valore</th><th></th></tr></thead>
          <tbody>
            ${f.schedaTecnica.map((s,i)=>`
              <tr>
                <td><input type="text" value="${s.campo}" onchange="updateSchedaCampo('${f.ref}',${i},'campo',this.value)" style="width:100%; border:none; background:none; font-weight:600; font-size:13px;"></td>
                <td><input type="text" value="${s.valore}" onchange="updateSchedaCampo('${f.ref}',${i},'valore',this.value)" style="width:100%; border:none; background:none; font-size:13px;"></td>
                <td><button style="border:none;background:none;color:var(--wine);cursor:pointer;font-size:11px" onclick="removeSchedaCampo('${f.ref}',${i})">rimuovi</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      ` : `<div class="empty-state" style="margin-bottom:10px;">Nessun campo tecnico ancora inserito per questo fornitore.</div>`}
      <div class="add-row" style="margin-top:10px;">
        <input type="text" id="newCampoNome" placeholder="Campo (es. Attrezzatura, Repertorio, Colori...)">
        <input type="text" id="newCampoValore" placeholder="Valore">
        <button onclick="addSchedaCampo('${f.ref}')">+ Aggiungi campo</button>
      </div>

      <div class="cat-title" style="margin-top:22px;"><h3 style="font-size:14px">Timeline del giorno</h3></div>
      ${tasks.length ? tasks.map((t,i)=>`
        <div class="task-row" style="align-items:center;">
          <input type="text" value="${t.t}" onchange="updateTimelineRow('${f.ref}',${i},'t',this.value)" style="width:80px; border:1px solid var(--rule); border-radius:6px; padding:5px 6px; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--wine); font-weight:600;">
          <input type="text" value="${t.d}" onchange="updateTimelineRow('${f.ref}',${i},'d',this.value)" style="flex:1; border:1px solid var(--rule); border-radius:6px; padding:5px 8px; font-size:13px;">
          <button style="border:none;background:none;color:var(--wine);cursor:pointer;font-size:11px" onclick="removeTimelineRow('${f.ref}',${i})">rimuovi</button>
        </div>
      `).join('') : `<div class="empty-state" style="margin-bottom:10px;">Nessuna voce di timeline ancora inserita per questo fornitore.</div>`}
      <div class="add-row" style="margin-top:10px;">
        <input type="text" id="newTaskTime" placeholder="Orario (es. 17:30)" style="width:110px;">
        <input type="text" id="newTaskDesc" placeholder="Cosa deve fare il fornitore">
        <button onclick="addTimelineRow('${f.ref}')">+ Aggiungi voce timeline</button>
      </div>
    </div>
  `;

  return selectHtml + schedaHtml;
}

function toggleFornitoreFlag(ref, field, value){
  const f = currentWedding().fornitori.find(x=>x.ref===ref);
  f[field] = value;
  persistWedding(currentWedding());
}
function updateFornitoreField(ref, field, value){
  const f = currentWedding().fornitori.find(x=>x.ref===ref);
  f[field] = value;
  persistWedding(currentWedding());
}
function addSchedaCampo(ref){
  const campo = document.getElementById('newCampoNome').value.trim();
  const valore = document.getElementById('newCampoValore').value.trim();
  if(!campo) return;
  const f = currentWedding().fornitori.find(x=>x.ref===ref);
  f.schedaTecnica.push({campo, valore});
  renderContent();
}
function updateSchedaCampo(ref, idx, field, value){
  const f = currentWedding().fornitori.find(x=>x.ref===ref);
  f.schedaTecnica[idx][field] = value;
  persistWedding(currentWedding());
}
function removeSchedaCampo(ref, idx){
  const f = currentWedding().fornitori.find(x=>x.ref===ref);
  f.schedaTecnica.splice(idx,1);
  renderContent();
}
function addTimelineRow(ref){
  const t = document.getElementById('newTaskTime').value.trim();
  const d = document.getElementById('newTaskDesc').value.trim();
  if(!d) return;
  const w = currentWedding();
  if(!w.tasks[ref]) w.tasks[ref] = [];
  w.tasks[ref].push({t: t || '—', d});
  renderContent();
}
function updateTimelineRow(ref, idx, field, value){
  currentWedding().tasks[ref][idx][field] = value;
  persistWedding(currentWedding());
}
function removeTimelineRow(ref, idx){
  currentWedding().tasks[ref].splice(idx,1);
  renderContent();
}

// ============ LISTA INVITATI ============
const MENU_LABELS = {carne:'Carne', pesce:'Pesce', vegetariano:'Vegetariano', vegano:'Vegano', bambino:'Bambino', staff:'Staff'};
const TIPO_TAVOLO_LABELS = {rotondo:'Tavolo rotondo', serpentina:'Imperiale / a serpentina', bambini:'Tavolo bambini', staff:'Tavolo staff'};

function setGuestSubtab(id){ state.guestSubtab = id; renderContent(); }

const RSVP_LABELS = {confermato:'Confermato', 'in attesa':'In attesa', declinato:'Declinato'};

function renderGuestList(w){
  const guests = w.guests || (w.guests = []);
  const subtabs = [['principale','Lista Principale (Sposi)'],['cucina','Per la cucina'],['particolarita','Particolarità menu'],['sala','Per i camerieri'],['accoglienza','Accoglienza ospiti']];
  const nav = `<div class="mood-subnav">${subtabs.map(([id,label])=>`
    <button class="${state.guestSubtab===id?'active':''}" onclick="setGuestSubtab('${id}')">${label}</button>
  `).join('')}</div>`;

  let body = '';
  if(state.guestSubtab==='principale') body = renderPrincipale(w, guests);
  else if(state.guestSubtab==='cucina') body = renderCucina(guests);
  else if(state.guestSubtab==='particolarita') body = renderParticolarita(guests);
  else if(state.guestSubtab==='sala') body = renderSala(guests);
  else body = renderAccoglienza(guests);

  return nav + body;
}

function renderPrincipale(w, guests){
  const ch = w.rsvpChannel || {tipo:'', valore:''};
  const rsvpBox = `
    <div class="criterio-note" style="display:flex; gap:16px; align-items:center; flex-wrap:wrap;">
      <div><b>Canale RSVP degli sposi:</b> ${ch.valore ? `${ch.tipo==='whatsapp'?'WhatsApp':'Email'} — ${ch.valore}` : 'non ancora fornito dagli sposi'}</div>
      <select id="rsvpTipo" style="padding:4px 8px; border-radius:6px; border:1px solid var(--rule)">
        <option value="whatsapp" ${ch.tipo==='whatsapp'?'selected':''}>WhatsApp</option>
        <option value="email" ${ch.tipo==='email'?'selected':''}>Email</option>
      </select>
      <input type="text" id="rsvpValore" placeholder="numero o indirizzo email" value="${ch.valore||''}" style="padding:6px 8px; border-radius:6px; border:1px solid var(--rule); min-width:220px;">
      <button class="btn-mini" onclick="saveRsvpChannel()">Salva canale RSVP</button>
    </div>
  `;

  const formHtml = `
    <div class="guest-form">
      <div><label>Cognome</label><input type="text" id="gCognome"></div>
      <div><label>Nome</label><input type="text" id="gNome"></div>
      <div><label>Tavolo</label><input type="text" id="gTavolo" placeholder="es. 4 / Uliveto B"></div>
      <div><label>Tipo tavolo</label><select id="gTipoTavolo">
        <option value="rotondo">Rotondo</option>
        <option value="serpentina">Imperiale / serpentina</option>
        <option value="bambini">Bambini</option>
        <option value="staff">Staff</option>
      </select></div>
      <div><label>Menu</label><select id="gMenu">
        <option value="carne">Carne</option>
        <option value="pesce">Pesce</option>
        <option value="vegetariano">Vegetariano</option>
        <option value="vegano">Vegano</option>
        <option value="bambino">Bambino</option>
        <option value="staff">Staff</option>
      </select></div>
      <div><label>Intolleranze / note</label><input type="text" id="gIntoll" placeholder="es. senza glutine"></div>
      <div>
        <label>Esigenze</label>
        <div class="checks">
          <label><input type="checkbox" id="gSeggiolino">Seggiolino</label>
          <label><input type="checkbox" id="gCarrozzina">Carrozzina</label>
          <label><input type="checkbox" id="gPasseggino">Passeggino</label>
        </div>
      </div>
      <div class="submit-cell"><button class="btn-mini" onclick="addGuest()">+ Aggiungi ospite</button></div>
    </div>
  `;

  if(!guests.length){
    return rsvpBox + formHtml + `<div class="empty-state">Nessun invitato ancora inserito.</div>`;
  }

  const tableHtml = `
    <div style="overflow-x:auto;">
    <table style="min-width:1180px;">
      <thead><tr>
        <th>Cognome</th><th>Nome</th><th>Tavolo</th><th>Menu</th><th>Intolleranze</th><th>RSVP</th>
        <th>Transfer Aeroporto → Hotel</th><th>Transfer Hotel → Cerimonia</th><th>Transfer Cerimonia → Ricevimento</th><th></th>
      </tr></thead>
      <tbody>
        ${guests.map((g,idx)=>`
          <tr>
            <td>${g.cognome}</td>
            <td>${g.nome}</td>
            <td>${g.tavolo}</td>
            <td><span class="menutag ${g.menu}">${MENU_LABELS[g.menu]}</span></td>
            <td>${g.intolleranze || '—'}</td>
            <td>
              <select onchange="updateGuestField(${idx},'rsvp',this.value)" style="border:1px solid var(--rule); border-radius:6px; padding:4px 6px; font-size:11.5px;">
                <option value="in attesa" ${g.rsvp==='in attesa'?'selected':''}>In attesa</option>
                <option value="confermato" ${g.rsvp==='confermato'?'selected':''}>Confermato</option>
                <option value="declinato" ${g.rsvp==='declinato'?'selected':''}>Declinato</option>
              </select>
            </td>
            <td>${transferCell(idx,'transferAH',g.transferAH)}</td>
            <td>${transferCell(idx,'transferHC',g.transferHC)}</td>
            <td>${transferCell(idx,'transferCR',g.transferCR)}</td>
            <td><button style="border:none;background:none;color:var(--wine);cursor:pointer;font-size:11px" onclick="removeGuest(${idx})">rimuovi</button></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
    </div>
  `;

  return rsvpBox + formHtml + tableHtml;
}

function transferCell(idx, field, t){
  t = t || {data:'',ora:''};
  return `
    <div style="display:flex; gap:4px;">
      <input type="date" value="${t.data||''}" onchange="updateGuestTransfer(${idx},'${field}','data',this.value)" style="font-size:11px; padding:3px; border:1px solid var(--rule); border-radius:4px;">
      <input type="time" value="${t.ora||''}" onchange="updateGuestTransfer(${idx},'${field}','ora',this.value)" style="font-size:11px; padding:3px; border:1px solid var(--rule); border-radius:4px;">
    </div>
  `;
}

function updateGuestField(idx, field, value){
  currentWedding().guests[idx][field] = value;
  persistWedding(currentWedding());
}
function updateGuestTransfer(idx, field, part, value){
  currentWedding().guests[idx][field][part] = value;
  persistWedding(currentWedding());
}
function saveRsvpChannel(){
  const w = currentWedding();
  w.rsvpChannel = { tipo: document.getElementById('rsvpTipo').value, valore: document.getElementById('rsvpValore').value.trim() };
  renderContent();
}

function addGuest(){
  const w = currentWedding();
  const cognome = document.getElementById('gCognome').value.trim();
  const nome = document.getElementById('gNome').value.trim();
  if(!cognome || !nome) return;
  w.guests.push({
    cognome, nome,
    tavolo: document.getElementById('gTavolo').value.trim() || '—',
    tipoTavolo: document.getElementById('gTipoTavolo').value,
    menu: document.getElementById('gMenu').value,
    intolleranze: document.getElementById('gIntoll').value.trim(),
    seggiolino: document.getElementById('gSeggiolino').checked,
    carrozzina: document.getElementById('gCarrozzina').checked,
    passeggino: document.getElementById('gPasseggino').checked,
    rsvp:'in attesa',
    transferAH:{data:'',ora:''}, transferHC:{data:'',ora:''}, transferCR:{data:'',ora:''},
  });
  renderContent();
}

function removeGuest(idx){
  currentWedding().guests.splice(idx,1);
  renderContent();
}

function tableGroupsOf(guests){
  const groups = {};
  const order = [];
  guests.forEach(g=>{
    if(!groups[g.tavolo]){ groups[g.tavolo]=[]; order.push(g.tavolo); }
    groups[g.tavolo].push(g);
  });
  return {groups, order};
}
function seatOf(guests, g){
  if(g.tipoTavolo==='bambini' || g.tipoTavolo==='staff') return null;
  const {groups} = tableGroupsOf(guests);
  return groups[g.tavolo].indexOf(g)+1;
}

function renderParticolarita(guests){
  if(!guests.length) return `<div class="empty-state">Nessun invitato ancora inserito.</div>`;
  const speciali = guests.filter(g=> (g.intolleranze && g.intolleranze.trim()) || ['vegetariano','vegano','pesce','bambino'].includes(g.menu));
  if(!speciali.length) return `<div class="empty-state">Nessuna intolleranza o menu particolare segnalato al momento — tutti gli ospiti hanno il menu standard.</div>`;

  // Gruppi per tipo di menu
  const menuOrder = ['vegetariano','vegano','pesce','bambino'];
  const menuGroups = menuOrder
    .map(tipo=>({ label: MENU_LABELS[tipo], rows: speciali.filter(g=>g.menu===tipo) }))
    .filter(gr=>gr.rows.length);

  // Gruppi per intolleranza (testo libero, raggruppato per valore normalizzato)
  const intollMap = {};
  speciali.filter(g=>g.intolleranze && g.intolleranze.trim()).forEach(g=>{
    const key = g.intolleranze.trim().toLowerCase();
    if(!intollMap[key]) intollMap[key] = { label: g.intolleranze.trim().replace(/^./,c=>c.toUpperCase()), rows: [] };
    intollMap[key].rows.push(g);
  });
  const intollGroups = Object.values(intollMap).sort((a,b)=>a.label.localeCompare(b.label));

  const renderGroupTable = (rows)=>{
    const sorted = [...rows].sort((a,b)=> a.tavolo.localeCompare(b.tavolo, undefined, {numeric:true}) || (seatOf(guests,a)||0)-(seatOf(guests,b)||0));
    return `
      <table>
        <thead><tr><th>Tavolo</th><th>Postazione</th><th>Cognome</th><th>Nome</th><th>Menu</th><th>Intolleranze / note</th></tr></thead>
        <tbody>
          ${sorted.map(g=>{
            const seat = seatOf(guests, g);
            return `
            <tr>
              <td>${g.tavolo}</td>
              <td>${seat ? `<span class="seat-num">${seat}</span>` : '—'}</td>
              <td>${g.cognome}</td>
              <td>${g.nome}</td>
              <td><span class="menutag ${g.menu}">${MENU_LABELS[g.menu]}</span></td>
              <td>${g.intolleranze || '—'}</td>
            </tr>
          `}).join('')}
        </tbody>
      </table>
    `;
  };

  return `
    <div class="criterio-note">
      Elenco unico per cucina e camerieri, raggruppato per tipologia: tutti i vegetariani insieme, tutti i vegani insieme, tutti gli intolleranti a una stessa cosa insieme — con tavolo e postazione per ogni ospite, così entrambi i reparti lavorano sulla stessa lista senza doverla incrociare con altre schede.
    </div>
    <div class="cards">
      <div class="card warn"><div class="label">Totale particolarità</div><div class="value">${speciali.length}</div></div>
      <div class="card"><div class="label">Con intolleranze</div><div class="value">${speciali.filter(g=>g.intolleranze).length}</div></div>
      <div class="card"><div class="label">Vegetariani</div><div class="value">${speciali.filter(g=>g.menu==='vegetariano').length}</div></div>
      <div class="card"><div class="label">Vegani</div><div class="value">${speciali.filter(g=>g.menu==='vegano').length}</div></div>
      <div class="card"><div class="label">Pesce</div><div class="value">${speciali.filter(g=>g.menu==='pesce').length}</div></div>
      <div class="card"><div class="label">Bambini</div><div class="value">${speciali.filter(g=>g.menu==='bambino').length}</div></div>
    </div>

    ${menuGroups.map(gr=>`
      <div class="cat-block">
        <div class="cat-title"><h3>${gr.label} <span style="font-weight:400; font-size:12px; color:var(--ink-soft)">(${gr.rows.length})</span></h3></div>
        ${renderGroupTable(gr.rows)}
      </div>
    `).join('')}

    ${intollGroups.length ? `
      <div class="cat-block">
        <div class="cat-title"><h3 style="font-size:15px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em;">Intolleranze / note particolari</h3></div>
      </div>
      ${intollGroups.map(gr=>`
        <div class="cat-block">
          <div class="cat-title"><h3>${gr.label} <span style="font-weight:400; font-size:12px; color:var(--ink-soft)">(${gr.rows.length})</span></h3></div>
          ${renderGroupTable(gr.rows)}
        </div>
      `).join('')}
    ` : ''}
  `;
}

function renderCucina(guests){
  if(!guests.length) return `<div class="empty-state">Nessun invitato ancora inserito.</div>`;
  const counts = {};
  guests.forEach(g=>{ counts[g.menu] = (counts[g.menu]||0)+1; });
  const conIntoll = guests.filter(g=>g.intolleranze).length;
  const sorted = [...guests].sort((a,b)=> a.menu.localeCompare(b.menu) || a.cognome.localeCompare(b.cognome));
  return `
    <div class="cards">
      ${Object.keys(MENU_LABELS).map(k=>`
        <div class="card"><div class="label">${MENU_LABELS[k]}</div><div class="value">${counts[k]||0}</div></div>
      `).join('')}
      <div class="card warn"><div class="label">Con intolleranze</div><div class="value">${conIntoll}</div></div>
      <div class="card"><div class="label">Totale coperti</div><div class="value">${guests.length}</div></div>
    </div>
    <table>
      <thead><tr><th>Cognome</th><th>Nome</th><th>Tavolo</th><th>Menu</th><th>Intolleranze / note</th><th></th></tr></thead>
      <tbody>
        ${sorted.map(g=>{
          const idx = guests.indexOf(g);
          return `
          <tr>
            <td>${g.cognome}</td>
            <td>${g.nome}</td>
            <td>${g.tavolo}</td>
            <td><span class="menutag ${g.menu}">${MENU_LABELS[g.menu]}</span></td>
            <td>${g.intolleranze || '—'}</td>
            <td><button class="remove" style="border:none;background:none;color:var(--wine);cursor:pointer;font-size:11px" onclick="removeGuest(${idx})">rimuovi</button></td>
          </tr>
        `}).join('')}
      </tbody>
    </table>
  `;
}

function renderSala(guests){
  if(!guests.length) return `<div class="empty-state">Nessun invitato ancora inserito.</div>`;
  const groups = {};
  const order = [];
  guests.forEach(g=>{
    if(!groups[g.tavolo]){ groups[g.tavolo]=[]; order.push(g.tavolo); }
    groups[g.tavolo].push(g);
  });
  return `
    <div class="criterio-note">
      <b>Criterio di numerazione postazioni:</b> nei tavoli rotondi la postazione 1 è il posto più vicino alla pista/tavolo sposi, poi si prosegue in senso orario. Nei tavoli imperiali e a serpentina la numerazione segue il percorso fisico del cameriere lungo il tavolo, da un'estremità all'altra. Il tavolo bambini e il tavolo staff non seguono una postazione fissa.
    </div>
    ${order.map(tav=>{
      const list = groups[tav];
      const tipo = list[0].tipoTavolo;
      return `
      <div class="table-group">
        <div class="table-group-head">
          <h4>Tavolo ${tav}</h4>
          <span class="tipo">${TIPO_TAVOLO_LABELS[tipo]} · ${list.length} coperti</span>
        </div>
        <table>
          <thead><tr><th>Postazione</th><th>Cognome</th><th>Nome</th><th>Esigenze</th></tr></thead>
          <tbody>
            ${list.map((g,i)=>`
              <tr>
                <td>${(tipo==='bambini'||tipo==='staff') ? '—' : `<span class="seat-num">${i+1}</span>`}</td>
                <td>${g.cognome}</td>
                <td>${g.nome}</td>
                <td>
                  ${g.seggiolino?'<span class="need-tag">Seggiolino</span>':''}
                  ${g.carrozzina?'<span class="need-tag">Carrozzina</span>':''}
                  ${g.passeggino?'<span class="need-tag">Passeggino</span>':''}
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `}).join('')}
  `;
}

function renderAccoglienza(guests){
  const search = `
    <div class="search-wrap">
      <input type="text" placeholder="Cerca per cognome..." value="${state.guestFilter}" oninput="filterAccoglienza(this.value)">
    </div>
  `;
  if(!guests.length) return search + `<div class="empty-state">Nessun invitato ancora inserito.</div>`;
  const filtered = guests.filter(g=> (g.cognome+' '+g.nome).toLowerCase().includes(state.guestFilter.toLowerCase()));
  const sorted = [...filtered].sort((a,b)=>a.cognome.localeCompare(b.cognome) || a.nome.localeCompare(b.nome));
  return search + `
    <div id="accoglienzaList">
      ${sorted.length ? sorted.map((g,i)=>{
        const idx = guests.indexOf(g);
        const isTable = g.tipoTavolo!=='bambini' && g.tipoTavolo!=='staff';
        const seatIdx = isTable ? guests.filter(x=>x.tavolo===g.tavolo).indexOf(g)+1 : null;
        return `
        <div class="accoglienza-row">
          <div class="who"><b>${g.cognome}</b> ${g.nome}</div>
          <div class="where">Tavolo ${g.tavolo}${seatIdx?` · Postazione ${seatIdx}`:''}</div>
        </div>
      `}).join('') : `<div class="empty-state">Nessun ospite trovato.</div>`}
    </div>
  `;
}

function filterAccoglienza(val){
  state.guestFilter = val;
  const guests = currentWedding().guests;
  const filtered = guests.filter(g=> (g.cognome+' '+g.nome).toLowerCase().includes(val.toLowerCase()));
  const sorted = [...filtered].sort((a,b)=>a.cognome.localeCompare(b.cognome) || a.nome.localeCompare(b.nome));
  document.getElementById('accoglienzaList').innerHTML = sorted.length ? sorted.map(g=>{
    const isTable = g.tipoTavolo!=='bambini' && g.tipoTavolo!=='staff';
    const seatIdx = isTable ? guests.filter(x=>x.tavolo===g.tavolo).indexOf(g)+1 : null;
    return `
      <div class="accoglienza-row">
        <div class="who"><b>${g.cognome}</b> ${g.nome}</div>
        <div class="where">Tavolo ${g.tavolo}${seatIdx?` · Postazione ${seatIdx}`:''}</div>
      </div>
    `;
  }).join('') : `<div class="empty-state">Nessun ospite trovato.</div>`;
}

// ============ MOODBOARD ============
function setMoodSubtab(id){ state.moodSubtab = id; renderContent(); }

function renderMoodboard(w){
  const mb = w.moodboard || (w.moodboard = {palette:[], stationery:[], floorplan:{zones:[],stations:[],tables:0,staffTable:''}});
  const subtabs = [['palette','Palette colori'],['stationery','Stationary graphic'],['planimetria','Planimetria & tavoli']];
  const nav = `<div class="mood-subnav">${subtabs.map(([id,label])=>`
    <button class="${state.moodSubtab===id?'active':''}" onclick="setMoodSubtab('${id}')">${label}</button>
  `).join('')}</div>`;

  let body = '';
  if(state.moodSubtab==='palette') body = renderPalette(mb);
  else if(state.moodSubtab==='stationery') body = renderStationery(mb);
  else body = renderFloorplan(w, mb);

  return nav + body;
}

function renderPalette(mb){
  return `
    <div class="add-row">
      <input type="color" id="newColorHex" value="#7A2635">
      <input type="text" id="newColorLabel" placeholder="Nome colore (es. Verde Uliveto)">
      <button onclick="addPaletteColor()">+ Aggiungi colore</button>
    </div>
    ${mb.palette.length ? `<div class="swatch-grid">
      ${mb.palette.map((c,i)=>`
        <div class="swatch">
          <div class="chip" style="background:${c.hex}"></div>
          <div class="info"><div class="name">${c.label}</div><div class="hex">${c.hex}</div></div>
          <button class="remove" onclick="removePaletteColor(${i})">rimuovi</button>
        </div>
      `).join('')}
    </div>` : `<div class="empty-state">Nessun colore in palette ancora — aggiungine uno qui sopra.</div>`}
  `;
}

function addPaletteColor(){
  const hex = document.getElementById('newColorHex').value;
  const label = document.getElementById('newColorLabel').value.trim() || 'Senza nome';
  currentWedding().moodboard.palette.push({hex, label});
  renderContent();
}
function removePaletteColor(i){
  currentWedding().moodboard.palette.splice(i,1);
  renderContent();
}

function renderStationery(mb){
  return `
    <div class="add-row">
      <input type="text" id="newStationCaption" placeholder="Didascalia (es. Segnaposto)">
      <button onclick="addStationeryCard()">+ Aggiungi voce</button>
    </div>
    ${mb.stationery.length ? `<div class="station-grid">
      ${mb.stationery.map((s,i)=>`
        <div class="station-card">
          <div class="thumb">${s.img ? `<img src="${s.img}">` : 'Nessuna immagine caricata'}</div>
          <div class="cap">${s.cap}</div>
          <label class="upload-mini">Carica bozzetto
            <input type="file" accept="image/*" onchange="uploadStationeryImage(${i}, this)">
          </label>
          <button class="remove" onclick="removeStationeryCard(${i})">rimuovi voce</button>
        </div>
      `).join('')}
    </div>` : `<div class="empty-state">Nessuna voce di stationary ancora — aggiungine una qui sopra.</div>`}
  `;
}
function addStationeryCard(){
  const cap = document.getElementById('newStationCaption').value.trim();
  if(!cap) return;
  currentWedding().moodboard.stationery.push({cap, img:null});
  renderContent();
}
function removeStationeryCard(i){
  currentWedding().moodboard.stationery.splice(i,1);
  renderContent();
}
function uploadStationeryImage(i, input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    currentWedding().moodboard.stationery[i].img = e.target.result;
    renderContent();
  };
  reader.readAsDataURL(file);
}

function renderFloorplan(w, mb){
  const fp = mb.floorplan;
  const tablesHtml = [];
  const perRow = 5;
  for(let t=1; t<=(fp.tables||0); t++){
    const row = Math.floor((t-1)/perRow);
    const col = (t-1)%perRow;
    tablesHtml.push(`<div class="table-dot" style="top:${44+row*13}%; left:${8+col*10}%">${t}</div>`);
  }
  const staffHtml = fp.staffTable ? `<div class="staff-table" style="top:38%; left:8%">${fp.staffTable}</div>` : '';
  const zonesHtml = (fp.zones||[]).map(z=>`<div class="zone-label" style="top:${z.top}; left:${z.left}">${z.label}</div>`).join('');
  const pinsHtml = (fp.stations||[]).map(s=>`
    <div class="station-pin" data-id="${s.id}" style="left:${s.x}%; top:${s.y}%" onpointerdown="startDragPin(event, ${s.id})">
      <span class="n">${s.id}</span>${s.label}
    </div>
  `).join('');

  if(!fp.stations || !fp.stations.length){
    return `<div class="empty-state">Nessuna planimetria ancora impostata per questo matrimonio.</div>`;
  }

  return `
    <div class="floorplan-wrap" id="floorplanWrap">
      ${zonesHtml}
      ${tablesHtml.join('')}
      ${staffHtml}
      ${pinsHtml}
    </div>
    <div class="floorplan-legend">
      ${(fp.stations||[]).map(s=>`<span><b>${s.id}</b> — ${s.label}</span>`).join('')}
    </div>
    <div class="floorplan-hint">Trascina le postazioni numerate per riorganizzare la planimetria. I pallini rappresentano i ${fp.tables} tavoli invitati.</div>
  `;
}

let dragState = null;
function attachDrag(w){
  const wrap = document.getElementById('floorplanWrap');
  if(!wrap) return;
  window.onpointermove = (e)=>{
    if(!dragState) return;
    const rect = wrap.getBoundingClientRect();
    let x = ((e.clientX - rect.left) / rect.width) * 100;
    let y = ((e.clientY - rect.top) / rect.height) * 100;
    x = Math.max(2, Math.min(96, x));
    y = Math.max(3, Math.min(95, y));
    dragState.el.style.left = x + '%';
    dragState.el.style.top = y + '%';
    dragState.x = x; dragState.y = y;
  };
  window.onpointerup = ()=>{
    if(dragState){
      const st = currentWedding().moodboard.floorplan.stations.find(s=>s.id===dragState.id);
      if(st){ st.x = dragState.x; st.y = dragState.y; }
      dragState = null;
      persistWedding(currentWedding());
    }
  };
}
function startDragPin(e, id){
  e.preventDefault();
  const wrap = document.getElementById('floorplanWrap');
  const el = wrap.querySelector(`.station-pin[data-id="${id}"]`);
  dragState = { id, el, x:null, y:null };
}

function renderAll(){
  renderSidebar();
  renderHeader();
  renderSubnav();
  renderContent();
}

// ============ PERSISTENZA: Firebase (produzione) oppure window.storage (anteprima qui in chat) ============
const PERSIST_FIELDS = ['categorie','fornitori','guests','moodboard','tasks','rsvpChannel'];

// STEP OBBLIGATORIO PER LA PUBBLICAZIONE: sostituisci questi valori con quelli
// del TUO progetto Firebase (Console Firebase → Impostazioni progetto → Le tue app → Config).
// Finché lasci "INSERISCI_QUI", l'app userà il salvataggio temporaneo di questa chat.
const firebaseConfig = {
  apiKey: "INSERISCI_QUI",
  authDomain: "INSERISCI_QUI",
  projectId: "INSERISCI_QUI",
  storageBucket: "INSERISCI_QUI",
  messagingSenderId: "INSERISCI_QUI",
  appId: "INSERISCI_QUI"
};

const FIREBASE_READY = (firebaseConfig.apiKey !== "INSERISCI_QUI" && typeof firebase !== 'undefined');
const HAS_STORAGE = (typeof window.storage !== 'undefined' && window.storage);

let fbApp=null, db=null, auth=null, currentUser=null;
if(FIREBASE_READY){
  fbApp = firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  auth = firebase.auth();
  auth.onAuthStateChanged(user=>{
    currentUser = user;
    renderSidebarFoot();
    if(state.role==='planner') renderContent();
  });
}

function setSaveStatus(text, color){
  const el = document.getElementById('saveStatus');
  if(el){ el.textContent = '● ' + text; el.style.color = color; }
}

async function persistWedding(w){
  if(!w) return;
  try{
    setSaveStatus('Salvataggio…', 'var(--ochre)');
    const payload = {};
    PERSIST_FIELDS.forEach(k=> payload[k] = w[k]);
    if(FIREBASE_READY){
      await db.collection('weddings').doc(w.id).set(payload, {merge:true});
    } else if(HAS_STORAGE){
      await window.storage.set('wedding:'+w.id, JSON.stringify(payload), true);
    } else { return; }
    setSaveStatus('Dati salvati', 'var(--sage)');
  }catch(e){
    console.error('Errore di salvataggio', e);
    setSaveStatus('Salvataggio non riuscito', 'var(--wine)');
  }
}

async function loadWedding(w){
  try{
    if(FIREBASE_READY){
      const doc = await db.collection('weddings').doc(w.id).get();
      if(doc.exists){
        const saved = doc.data();
        PERSIST_FIELDS.forEach(k=>{ if(saved[k]!==undefined) w[k] = saved[k]; });
      } else {
        await persistWedding(w); // prima volta: salva i dati di esempio come base
      }
    } else if(HAS_STORAGE){
      const res = await window.storage.get('wedding:'+w.id, true);
      if(res && res.value){
        const saved = JSON.parse(res.value);
        PERSIST_FIELDS.forEach(k=>{ if(saved[k]!==undefined) w[k] = saved[k]; });
      } else {
        await persistWedding(w);
      }
    }
  }catch(e){
    try{ await persistWedding(w); }catch(e2){ console.error(e2); }
  }
}

async function resetAllData(){
  if(!confirm('Vuoi davvero riportare tutti i matrimoni ai dati di partenza? Le modifiche salvate andranno perse.')) return;
  if(FIREBASE_READY){
    for(const w of weddings){ try{ await db.collection('weddings').doc(w.id).delete(); }catch(e){} }
  } else if(HAS_STORAGE){
    for(const w of weddings){ try{ await window.storage.delete('wedding:'+w.id, true); }catch(e){} }
  }
  location.reload();
}

// ============ LOGIN (solo planner, solo se Firebase è configurato) ============
async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  try{
    await auth.signInWithEmailAndPassword(email, pass);
  }catch(e){
    errEl.textContent = 'Accesso non riuscito — controlla email e password.';
  }
}
async function doLogout(){
  await auth.signOut();
}
function renderSidebarFoot(){
  const el = document.getElementById('authStatus');
  if(!el) return;
  if(FIREBASE_READY && currentUser){
    el.innerHTML = `Connessa come <b>${currentUser.email}</b> · <button onclick="doLogout()" style="border:none;background:none;color:var(--wine);cursor:pointer;text-decoration:underline;font-size:10.5px;">Esci</button>`;
  } else if(FIREBASE_READY){
    el.innerHTML = `Non connessa`;
  } else {
    el.innerHTML = '';
  }
}
function renderLoginScreen(){
  return `
    <div class="fornitore-card" style="max-width:360px; margin:40px auto;">
      <h2>Accesso Wedding Planner</h2>
      <div class="cat">Inserisci le credenziali del tuo account Firebase</div>
      <div style="display:flex; flex-direction:column; gap:10px; margin-top:14px;">
        <input type="email" id="loginEmail" placeholder="Email" style="padding:9px 10px; border:1px solid var(--rule); border-radius:6px;">
        <input type="password" id="loginPass" placeholder="Password" style="padding:9px 10px; border:1px solid var(--rule); border-radius:6px;">
        <button class="btn-mini" onclick="doLogin()">Accedi</button>
        <div id="loginError" style="color:var(--wine); font-size:12px;"></div>
      </div>
    </div>
  `;
}

async function initApp(){
  for(const w of weddings){ await loadWedding(w); }
  renderAll();
  renderSidebarFoot();
  if(!FIREBASE_READY && !HAS_STORAGE){ setSaveStatus('Salvataggio non disponibile in questa modalità', 'var(--ink-soft)'); }
  const overlay = document.getElementById('loadingOverlay');
  if(overlay) overlay.style.display = 'none';
}

initApp();
</script>
